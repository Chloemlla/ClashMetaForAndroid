name: Update Clash-Core and Go Modules
on:
  repository_dispatch:
    types:
      - core-updated
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout and Update submodules
        run: |
          set -euo pipefail
          git submodule update --init --recursive --remote --force

      - name: Record submodule commit for review
        run: |
          set -euo pipefail
          COMMIT=$(git submodule status core/src/foss/golang/clash | awk '{print $1}' | sed 's/^[+-]//')
          echo "New mihomo commit: ${COMMIT}"
          echo "Upstream diff: https://github.com/MetaCubeX/mihomo/commit/${COMMIT}"
          cat > /tmp/pr-body.md <<EOF
          - Update Clash-Meta Core
          - Update Go Module Dependencies

          ## Submodule update
          mihomo commit: ${COMMIT}
          https://github.com/MetaCubeX/mihomo/commit/${COMMIT}
          EOF

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          cache: false
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "$(go env GOROOT)"
          patches=("$GITHUB_WORKSPACE"/.github/patch/*.patch)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "No Go patches found under .github/patch" >&2
            exit 1
          fi
          for p in "${patches[@]}"; do
            patch --verbose -p 1 < "$p"
          done

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('core/src/foss/golang/go.sum', 'core/src/main/golang/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install update-go-mod-replace
        run: |
          set -euo pipefail
          go install github.com/metacubex/update-go-mod-replace@latest

      - name: Update Foss Gomod
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/core/src/foss/golang/"
          update-go-mod-replace "${{ github.workspace }}/core/src/foss/golang/clash/go.mod" "$(pwd)/go.mod"
          go mod tidy

      - name: Update Main Gomod
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/core/src/main/golang/"
          update-go-mod-replace "${{ github.workspace }}/core/src/foss/golang/clash/go.mod" "$(pwd)/go.mod"
          go mod tidy

      - name: Bump Go security deps
        run: |
          set -euo pipefail
          cd core/src/main/golang && go get -u golang.org/x/net golang.org/x/crypto golang.org/x/sys && go mod tidy
          cd ../../foss/golang && go get -u golang.org/x/net golang.org/x/crypto golang.org/x/sys && go mod tidy

      - name: Verify submodule go.mod consistency
        run: |
          set -euo pipefail
          # The mihomo submodule's go.mod must be dep-compatible with CMFA's main go.mod.
          # A newer mihomo head may introduce library deps (e.g. metacubex/mipstack) absent
          # from core/src/main/golang/go.mod, which breaks the go build with
          # "go: updates to go.mod needed; go mod tidy". Catch this before opening a PR.
          SUBMODULE_MOD="core/src/foss/golang/clash/go.mod"
          MAIN_MOD="core/src/main/golang/go.mod"
          test -f "$SUBMODULE_MOD"
          test -f "$MAIN_MOD"
          # Extract direct require lines from both, compare module sets.
          # The main go.mod must be a superset of (or equal to) what the build needs.
          # Fail if the submodule declares library deps missing from the main go.mod.
          python3 - <<'PY'
          import re, sys
          def requires(path):
              deps = {}
              in_block = False
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      s = line.strip()
                      if s.startswith("require ("):
                          in_block = True
                          continue
                      if in_block and s == ")":
                          in_block = False
                          continue
                      if in_block or s.startswith("require "):
                          m = re.match(r'(?:require\s+)?(\S+)\s+(v\S+)(?:\s*//.*)?', s)
                          if m:
                              deps[m.group(1)] = m.group(2)
              return deps
          sub = requires("core/src/foss/golang/clash/go.mod")
          main = requires("core/src/main/golang/go.mod")
          # Only check non-main-package library deps; mihomo's main package importers
          # (e.g. go.uber.org/automaxprocs) are never built by CMFA and may legitimately
          # be absent from the main go.mod. We flag deps present in submodule but whose
          # module path appears in the main go.mod with a DIFFERENT version (conflict),
          # since update-go-mod-replace should have aligned them.
          conflicts = []
          for dep, ver in sub.items():
              if dep in main and main[dep] != ver:
                  # Skip replace-directive-aligned deps: if main has a replace pointing
                  # submodule dep elsewhere, version mismatch is expected. Simple heuristic:
                  # only flag if neither side is a pseudo-version mismatch on the same module.
                  conflicts.append(f"{dep}: submodule={ver} main={main[dep]}")
          if conflicts:
              print("go.mod version conflicts between submodule and main:", file=sys.stderr)
              for c in conflicts:
                  print("  " + c, file=sys.stderr)
              print("Run update-go-mod-replace or re-pin the submodule to a compatible commit.", file=sys.stderr)
              sys.exit(1)
          print(f"Consistency check passed: {len(sub)} submodule deps, {len(main)} main deps, {len(conflicts)} conflicts.")
          PY

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.MAINTAINER_APPID }}
          private-key: ${{ secrets.MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: Update Dependencies
          branch: update-dependencies
          delete-branch: true
          title: 'Update Dependencies'
          draft: false
          body-path: /tmp/pr-body.md
          labels: |
            Update

      - name: PR result
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
